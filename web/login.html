<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Shield — Login</title>
    <meta name="description" content="Sign in to MCP Shield to access your security dashboard, scan history, and billing.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-2: #1a1a28;
            --border: #2a2a3a;
            --text: #e4e4ef;
            --text-dim: #8888a0;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
            --orange: #f97316;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        /* Nav */
        nav {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
        }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.03em; text-decoration: none; color: var(--text); }
        .logo span { color: var(--accent); }
        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: var(--text); }

        /* Main layout */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            position: relative;
        }
        main::before {
            content: '';
            position: absolute;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 600px; height: 400px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Auth card */
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header .logo {
            display: block;
            font-size: 1.4rem;
            margin-bottom: 16px;
        }
        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }
        .auth-header p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        /* Mode toggle */
        .mode-toggle {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .mode-btn {
            flex: 1;
            padding: 9px;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
            user-select: none;
        }
        .mode-btn.active {
            background: var(--accent);
            color: white;
        }
        .mode-btn:not(.active):hover { color: var(--text); }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 7px;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            padding: 13px 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        input::placeholder { color: var(--text-dim); opacity: 0.5; }
        input.error { border-color: var(--red); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: #4f46e5; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Error / success messages */
        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 16px;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--red);
        }
        .alert.success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--green);
        }
        .alert.show { display: block; }

        /* Spinner */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        .spinner.show { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Divider */
        .divider {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            margin: 20px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: calc(50% - 24px);
            height: 1px;
            background: var(--border);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        /* Footer note */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--text-dim);
        }
        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .auth-footer a:hover { text-decoration: underline; }

        /* Forgot password */
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-decoration: none;
            margin-top: 6px;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: var(--accent); }

        /* Footer */
        footer {
            padding: 28px 0;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        footer a { color: var(--text-dim); text-decoration: none; }
        footer a:hover { color: var(--accent); }

        /* Name field only shows on signup */
        #name-group { display: none; }

        @media (max-width: 480px) {
            .auth-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">MCP<span>Shield</span></a>
            <a href="/" class="back-link">
                &#8592; Back to home
            </a>
        </div>
    </nav>

    <main>
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo">MCP<span>Shield</span></span>
                <h1 id="auth-title">Welcome back</h1>
                <p id="auth-subtitle">Sign in to access your security dashboard</p>
            </div>

            <div class="mode-toggle">
                <div class="mode-btn active" id="btn-login" onclick="setMode('login')">Sign In</div>
                <div class="mode-btn" id="btn-signup" onclick="setMode('signup')">Sign Up</div>
            </div>

            <div class="alert error" id="error-msg"></div>
            <div class="alert success" id="success-msg"></div>

            <form id="auth-form" onsubmit="handleSubmit(event)" novalidate>
                <div class="form-group" id="name-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Jane Smith" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" autocomplete="current-password" required>
                    <a href="#" class="forgot-link" id="forgot-link" onclick="handleForgot(event)">Forgot password?</a>
                </div>

                <button type="submit" class="btn" id="submit-btn">
                    <span class="spinner" id="spinner"></span>
                    <span id="submit-label">Sign In</span>
                </button>
            </form>

            <div class="auth-footer" id="switch-text">
                Don't have an account? <a href="#" onclick="setMode('signup'); return false;">Sign up free</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Built by <a href="https://timolabs.dev">TimoLabs</a> &middot; <a href="https://github.com/ArkYa-AI/mcpshield">Open Source</a> &middot; MIT License</p>
        </div>
    </footer>

    <script>
        const API_BASE = window.location.origin;
        let currentMode = 'login';

        // If already logged in, go straight to dashboard
        (function() {
            const token = localStorage.getItem('mcpshield_token');
            if (token) {
                window.location.href = '/dashboard';
            }
        })();

        function setMode(mode) {
            currentMode = mode;
            const isSignup = mode === 'signup';

            document.getElementById('btn-login').classList.toggle('active', !isSignup);
            document.getElementById('btn-signup').classList.toggle('active', isSignup);

            document.getElementById('name-group').style.display = isSignup ? 'block' : 'none';
            document.getElementById('auth-title').textContent = isSignup ? 'Create your account' : 'Welcome back';
            document.getElementById('auth-subtitle').textContent = isSignup
                ? 'Start scanning MCP servers for free'
                : 'Sign in to access your security dashboard';
            document.getElementById('submit-label').textContent = isSignup ? 'Create Account' : 'Sign In';
            document.getElementById('forgot-link').style.display = isSignup ? 'none' : 'block';
            document.getElementById('switch-text').innerHTML = isSignup
                ? 'Already have an account? <a href="#" onclick="setMode(\'login\'); return false;">Sign in</a>'
                : 'Don\'t have an account? <a href="#" onclick="setMode(\'signup\'); return false;">Sign up free</a>';

            // Reset autocomplete hint for password
            document.getElementById('password').autocomplete = isSignup ? 'new-password' : 'current-password';

            clearMessages();
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('success-msg').classList.remove('show');
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('error-msg').classList.remove('show');
        }

        function clearMessages() {
            document.getElementById('error-msg').classList.remove('show');
            document.getElementById('success-msg').classList.remove('show');
        }

        function setLoading(loading) {
            const btn = document.getElementById('submit-btn');
            const spinner = document.getElementById('spinner');
            btn.disabled = loading;
            spinner.classList.toggle('show', loading);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value.trim();

            if (!email) { showError('Please enter your email address.'); return; }
            if (!password) { showError('Please enter your password.'); return; }
            if (currentMode === 'signup' && password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }

            setLoading(true);

            try {
                const endpoint = currentMode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';
                const body = currentMode === 'login'
                    ? { email, password }
                    : { email, password, name: name || undefined };

                const res = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.detail || data.message || 'Authentication failed. Please try again.');
                    return;
                }

                // Store token and user info
                if (data.access_token) {
                    localStorage.setItem('mcpshield_token', data.access_token);
                }
                if (data.user) {
                    localStorage.setItem('mcpshield_user', JSON.stringify(data.user));
                }

                if (currentMode === 'signup') {
                    showSuccess('Account created! Redirecting to your dashboard…');
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                } else {
                    window.location.href = '/dashboard';
                }

            } catch (err) {
                showError('Network error. Please check your connection and try again.');
            } finally {
                setLoading(false);
            }
        }

        function handleForgot(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showError('Enter your email address first, then click "Forgot password?"');
                return;
            }
            // TODO: wire up to /api/v1/auth/forgot-password
            showSuccess('If that email exists, a reset link is on its way.');
        }
    </script>
</body>
</html>
